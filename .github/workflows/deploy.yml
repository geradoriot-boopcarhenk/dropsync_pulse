name: DropSync Pulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar Dependências do Sistema
      run: |
        python -m pip install --upgrade pip
        pip install supabase httpx firebase-admin python-dotenv BeautifulSoup4 streamlit pandas fastapi uvicorn

    - name: Executar Validação de Sintaxe (Syntax Check)
      run: |
        # Varre os arquivos Python garantindo que não há erros de indentação ou compilação
        python -m compileall .

    - name: Homologar Mecanismo Assíncrono (Stress Test)
      run: |
        # Executa o teste de estresse de semáforos no ambiente virtualizado do GitHub
        python stress_test.py
      env:
        SUPABASE_URL: "https://supabase.co"
        SUPABASE_SERVICE_ROLE_KEY: "mock-key"
